<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FastLink - URL Shortener & Auto Redirect</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #000000;
      color: #ffffff;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between items-center p-4 selection:bg-indigo-500 selection:text-white">

  <!-- Header -->
  <header class="w-full max-w-2xl py-6 text-center">
    <h2 class="text-2xl font-extrabold tracking-tight bg-gradient-to-r from-indigo-400 to-cyan-400 bg-clip-text text-transparent">⚡ FastLink Shortener</h2>
  </header>

  <!-- Main Container -->
  <main class="w-full max-w-lg mx-auto flex-1 flex items-center justify-center">
    
    <!-- Redirecting View (Shown when ?lnk= is present) -->
    <div id="redirectView" class="hidden w-full bg-[#121212] border border-neutral-800 rounded-3xl p-8 text-center shadow-2xl">
      <div class="w-16 h-16 border-4 border-indigo-500 border-t-transparent rounded-full animate-spin mx-auto mb-6"></div>
      <h2 id="customLoadingTitle" class="text-2xl font-bold text-white mb-3">লোড হচ্ছে...</h2>
      <p class="text-neutral-400 text-sm">অনুগ্রহ করে ৩ সেকেন্ড অপেক্ষা করুন...</p>
    </div>

    <!-- Shortener View (Home) -->
    <div id="shortenerView" class="w-full bg-[#121212] border border-neutral-800 rounded-3xl p-8 shadow-2xl">
      <div class="text-center mb-8">
        <h1 class="text-3xl font-extrabold text-white mb-2">লিংক ছোট করুন</h1>
        <p class="text-neutral-400 text-sm">আপনার বড় লিংক এবং লোডিং টেক্সট দিয়ে শর্ট লিংক তৈরি করুন।</p>
      </div>

      <div class="space-y-5">
        <!-- Input 1: Original Link -->
        <div>
          <label class="block text-xs font-semibold text-neutral-300 uppercase tracking-wider mb-2">অরিজিনাল লিংক</label>
          <input id="longUrl" type="url" placeholder="https://example.com/very-long-url..." class="w-full px-4 py-3.5 bg-black border border-neutral-800 rounded-xl text-white placeholder-neutral-600 focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 transition-all text-sm"/>
        </div>

        <!-- Input 2: Custom Loading Text -->
        <div>
          <label class="block text-xs font-semibold text-neutral-300 uppercase tracking-wider mb-2">লোডিং স্ক্রিন টেক্সট (ঐচ্ছিক)</label>
          <input id="loadingText" type="text" placeholder="যেমন: আপনার ফাইল প্রস্তুত হচ্ছে, অপেক্ষা করুন..." class="w-full px-4 py-3.5 bg-black border border-neutral-800 rounded-xl text-white placeholder-neutral-600 focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 transition-all text-sm"/>
        </div>

        <button onclick="generateShortLink()" class="w-full py-3.5 bg-indigo-600 hover:bg-indigo-500 text-white font-semibold rounded-xl shadow-lg shadow-indigo-600/30 transition-all transform active:scale-[0.98] text-sm cursor-pointer">
          Shorten Link 🚀
        </button>
      </div>

      <!-- Result Box -->
      <div id="resultBox" class="hidden mt-6 p-5 bg-black border border-neutral-800 rounded-2xl">
        <div class="text-xs font-semibold text-indigo-400 uppercase tracking-wider mb-2">আপনার শর্ট লিংক</div>
        <div id="shortUrl" class="text-sm font-medium text-cyan-300 break-all mb-4 select-all bg-neutral-950 p-3 rounded-xl border border-neutral-900"></div>
        <button onclick="copyLink()" class="w-full py-2.5 bg-emerald-600 hover:bg-emerald-500 text-white font-medium rounded-xl text-xs transition-all shadow-md shadow-emerald-600/20 flex items-center justify-center gap-2 cursor-pointer">
          <span>📋</span> লিংক কপি করুন
        </button>
      </div>
    </div>

  </main>

  <!-- Footer -->
  <footer class="w-full max-w-2xl py-6 text-center text-xs text-neutral-600">
    <p>Powered by GitHub Pages &bull; Black Skin URL Shortener</p>
  </footer>

  <!-- Script Logic -->
  <script>
    const currentBaseUrl = window.location.origin + window.location.pathname;
    const MONETIZATION_URL = "https://uplcm.com/4/11396881";

    window.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const encodedTarget = urlParams.get('lnk');

      if (encodedTarget) {
        document.getElementById('shortenerView').style.display = 'none';
        document.getElementById('redirectView').style.display = 'block';

        try {
          const decodedData = JSON.parse(atob(encodedTarget));
          const targetUrl = decodedData.url;
          const customText = decodedData.text ? decodedData.text.trim() : "";

          if (customText) {
            document.getElementById('customLoadingTitle').textContent = customText;
          } else {
            document.getElementById('customLoadingTitle').textContent = "লোড হচ্ছে, অনুগ্রহ করে অপেক্ষা করুন...";
          }
          
          // Wait 3 seconds, then open monetization link in new tab and redirect current tab to original URL
          setTimeout(() => {
            // Open monetization link in new tab safely
            const newTabLink = document.createElement('a');
            newTabLink.href = MONETIZATION_URL;
            newTabLink.target = '_blank';
            document.body.appendChild(newTabLink);
            newTabLink.click();
            document.body.removeChild(newTabLink);

            // Redirect current tab to original URL
            window.location.href = targetUrl;
          }, 3000);

        } catch (e) {
          try {
            const originalUrl = atob(encodedTarget);
            setTimeout(() => {
              const newTabLink = document.createElement('a');
              newTabLink.href = MONETIZATION_URL;
              newTabLink.target = '_blank';
              document.body.appendChild(newTabLink);
              newTabLink.click();
              document.body.removeChild(newTabLink);

              window.location.href = originalUrl;
            }, 3000);
          } catch (err) {
            document.getElementById('customLoadingTitle').textContent = "ভুল বা অকার্যকর লিংক!";
            setTimeout(() => {
              window.location.replace(currentBaseUrl);
            }, 2000);
          }
        }
      }
    });

    function generateShortLink() {
      const longUrlInput = document.getElementById('longUrl').value.trim();
      const loadingTextInput = document.getElementById('loadingText').value.trim();

      if (!longUrlInput) {
        alert("দয়া করে অরিজিনাল লিংকটি প্রবেশ করান।");
        return;
      }

      if (!longUrlInput.startsWith('http://') && !longUrlInput.startsWith('https://')) {
        alert("লিংকটি অবশ্যই http:// বা https:// দিয়ে শুরু হতে হবে।");
        return;
      }

      const payload = {
        url: longUrlInput,
        text: loadingTextInput
      };

      const encodedData = btoa(JSON.stringify(payload));
      const finalShortLink = currentBaseUrl.replace(/\/$/, "") + "/?lnk=" + encodedData;

      document.getElementById('shortUrl').textContent = finalShortLink;
      document.getElementById('resultBox').style.display = 'block';
    }

    function copyLink() {
      const shortUrlText = document.getElementById('shortUrl').textContent;
      navigator.clipboard.writeText(shortUrlText).then(() => {
        alert("লিংকটি সফলভাবে কপি হয়েছে!");
      }).catch(() => {
        alert("কপি করা যায়নি, ম্যানুয়ালি কপি করুন।");
      });
    }
  </script>

</body>
</html>
