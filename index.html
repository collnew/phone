<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FastLink - URL Shortener & Auto Redirect</title>
  <!-- Tailwind CSS CDN for Modern UI -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
    }
  </style>
</head>
<body class="bg-gradient-to-br from-slate-900 via-indigo-950 to-slate-900 min-h-screen text-slate-100 flex flex-col justify-between items-center p-4">

  <!-- Header -->
  <header class="w-full max-w-2xl py-6 text-center">
    <h2 class="text-2xl font-bold tracking-tight bg-gradient-to-r from-indigo-400 to-cyan-400 bg-clip-text text-transparent">⚡ FastLink Shortener</h2>
  </header>

  <!-- Main Container -->
  <main class="w-full max-w-lg mx-auto flex-1 flex items-center justify-center">
    
    <!-- Redirecting View (Shown when ?lnk= is present) -->
    <div id="redirectView" class="hidden w-full bg-slate-800/80 backdrop-blur-md border border-slate-700 rounded-3xl p-8 text-center shadow-2xl">
      <div class="w-16 h-16 border-4 border-indigo-500 border-t-transparent rounded-full animate-spin mx-auto mb-6"></div>
      <h2 class="text-2xl font-bold text-white mb-2">রিডাইরেক্ট হচ্ছে...</h2>
      <p class="text-slate-400 text-sm mb-6">অনুগ্রহ করে অপেক্ষা করুন, আপনাকে অরিজিনাল লিংকে নিয়ে যাওয়া হচ্ছে।</p>
      <div id="targetUrlDisplay" class="text-xs text-indigo-300 bg-slate-900/60 p-3 rounded-xl break-all border border-slate-700/50"></div>
    </div>

    <!-- Shortener View (Home) -->
    <div id="shortenerView" class="w-full bg-slate-800/80 backdrop-blur-md border border-slate-700 rounded-3xl p-8 shadow-2xl">
      <div class="text-center mb-8">
        <h1 class="text-3xl font-extrabold text-white mb-2">লিংক ছোট করুন</h1>
        <p class="text-slate-400 text-sm">আপনার বড় লিংকটি বক্সে পেস্ট করে নিমেষেই শর্ট লিংক তৈরি করুন।</p>
      </div>

      <div class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">অরিজিনাল লিংক</label>
          <input id="longUrl" type="url" placeholder="https://example.com/very-long-url..." class="w-full px-4 py-3.5 bg-slate-900/80 border border-slate-700 rounded-xl text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 transition-all text-sm"/>
        </div>

        <button onclick="generateShortLink()" class="w-full py-3.5 bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-500 hover:to-violet-500 text-white font-semibold rounded-xl shadow-lg shadow-indigo-500/25 transition-all transform active:scale-[0.98] text-sm cursor-pointer">
          Shorten Link 🚀
        </button>
      </div>

      <!-- Result Box -->
      <div id="resultBox" class="hidden mt-6 p-5 bg-slate-900/90 border border-indigo-500/30 rounded-2xl">
        <div class="text-xs font-semibold text-indigo-400 uppercase tracking-wider mb-2">আপনার শর্ট লিংক</div>
        <div id="shortUrl" class="text-sm font-medium text-cyan-300 break-all mb-4 select-all bg-slate-950/50 p-3 rounded-xl border border-slate-800"></div>
        <button onclick="copyLink()" class="w-full py-2.5 bg-emerald-600 hover:bg-emerald-500 text-white font-medium rounded-xl text-xs transition-all shadow-md shadow-emerald-600/20 flex items-center justify-center gap-2 cursor-pointer">
          <span>📋</span> লিংক কপি করুন
        </button>
      </div>
    </div>

  </main>

  <!-- Footer -->
  <footer class="w-full max-w-2xl py-6 text-center text-xs text-slate-500">
    <p>Powered by GitHub Pages &bull; Fast & Secure URL Shortener</p>
  </footer>

  <!-- Script Logic -->
  <script>
    const currentBaseUrl = window.location.origin + window.location.pathname;

    window.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const encodedTarget = urlParams.get('lnk');

      if (encodedTarget) {
        document.getElementById('shortenerView').style.display = 'none';
        document.getElementById('redirectView').style.display = 'block';

        try {
          const originalUrl = atob(encodedTarget);
          document.getElementById('targetUrlDisplay').textContent = originalUrl;
          
          // Smooth redirect after 1.2 seconds
          setTimeout(() => {
            window.location.replace(originalUrl);
          }, 1200);
        } catch (e) {
          document.getElementById('targetUrlDisplay').textContent = "ভুল বা অকার্যকর লিংক!";
          setTimeout(() => {
            window.location.replace(currentBaseUrl);
          }, 2000);
        }
      }
    });

    function generateShortLink() {
      const longUrlInput = document.getElementById('longUrl').value.trim();

      if (!longUrlInput) {
        alert("দয়া করে একটি লিংক প্রবেশ করান।");
        return;
      }

      if (!longUrlInput.startsWith('http://') && !longUrlInput.startsWith('https://')) {
        alert("লিংকটি অবশ্যই http:// বা https:// দিয়ে শুরু হতে হবে।");
        return;
      }

      const encodedUrl = btoa(longUrlInput);
      const finalShortLink = currentBaseUrl.replace(/\/$/, "") + "/?lnk=" + encodedUrl;

      document.getElementById('shortUrl').textContent = finalShortLink;
      document.getElementById('resultBox').style.display = 'block';
    }

    function copyLink() {
      const shortUrlText = document.getElementById('shortUrl').textContent;
      navigator.clipboard.writeText(shortUrlText).then(() => {
        alert("লিংকটি সফলভাবে কপি হয়েছে!");
      }).catch(() => {
        alert("কপি করা যায়নি, ম্যানুয়ালি কপি করুন।");
      });
    }
  </script>

</body>
</html>
